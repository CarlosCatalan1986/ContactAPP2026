name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-sim.txt }
      - run: pip install -r requirements-sim.txt
      - name: Smoke test (/api/health)
        run: |
          uvicorn main:app --port 8010 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8010/api/health && exit 0; sleep 1; done; exit 1

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
        env: { VITE_BACKEND_URL: "https://app-contactapp-api.onrender.com" }

  deploy-backend:
    # Render despliega solo con autoDeploy; este job sólo dispara el Deploy Hook si existe.
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Render deploy hook
        env: { HOOK: "${{ secrets.RENDER_DEPLOY_HOOK }}" }
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "Sin RENDER_DEPLOY_HOOK: Render usa autoDeploy"; fi
