# Render Blueprint — backend FastAPI + WebSocket en plan FREE
# Render → New → Blueprint → selecciona este repo. Lee este archivo desde la raíz.
services:
  - type: web
    name: app-contactapp-api
    runtime: python
    plan: free
    rootDir: backend
    # requirements-sim.txt = sin CrewAI (cabe en los 512 MB del plan free).
    # Para usar CrewAI cambia a requirements.txt (puede requerir plan pago).
    buildCommand: pip install -r requirements-sim.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CORS_ORIGINS
        value: https://app-contactapp.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: "^https://app-contactapp(-[a-z0-9-]+)?\\.vercel\\.app$"
      - key: LLM_PROVIDER
        value: none
      - key: LLM_API_KEY
        sync: false   # se pide en el dashboard; nunca en el repo
      - key: SIM_SPEED
        value: "1"
